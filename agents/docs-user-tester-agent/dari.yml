name: docs-user-tester-agent
harness: pi

instructions:
  system: prompts/system.md

sandbox:
  provider: e2b
  internet_access: true
  runtimes:
    python: "3.13"
    node: "22"
  packages:
    apt:
      - build-essential
      - ca-certificates
      - curl
      - file
      - git
      - jq
      - python3-pip
      - python3-venv
      - procps
      - ripgrep
      - unzip
      - tar

llm:
  default: claude-sonnet-4-6
  options:
    claude-haiku-4-5:
      provider: anthropic
      model: claude-haiku-4-5
    claude-sonnet-4-6:
      provider: anthropic
      model: claude-sonnet-4-6
    claude-opus-4-7:
      provider: anthropic
      model: claude-opus-4-7
    gpt-5-mini:
      provider: openai
      model: gpt-5-mini
    gpt-5.1:
      provider: openai
      model: gpt-5.1
    gpt-5.5:
      provider: openai
      model: gpt-5.5

built_in_tools:
  - read
  - bash
  - write
  - edit

skills:
  - name: docs-user-test
    path: skills/docs-user-test
